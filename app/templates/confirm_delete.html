{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<header>
  <div>
    <h1>{{ page_title }}</h1>
    <div class="muted">{{ subtitle }}</div>
  </div>
  <a href="{{ back_url }}">{{ back_label }}</a>
</header>
<section class="panel">
  <p>{{ message }}</p>
  <form method="post" action="{{ action_url }}">
    <div class="actions">
      <button class="danger" type="submit">Confirm Delete</button>
      <a class="button secondary" href="{{ cancel_url }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
